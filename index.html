<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐私浏览器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0B0E14;
      color: #F8FAFC;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #1E293B;
      border-bottom: 1px solid #334155;
      -webkit-app-region: drag;
      position: relative;
      z-index: 100;
    }

    .loading-bar {
      height: 2px;
      background: linear-gradient(90deg, #22D3EE, #38BDF8);
      transition: width 0.3s ease;
      position: absolute;
      bottom: -1px;
      left: 0;
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
    }

    /* 导航按钮 */
    .nav-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(51, 65, 85, 0.5);
      color: #F8FAFC;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
      font-size: 16px;
      backdrop-filter: blur(10px);
    }

    .nav-btn:hover:not(:disabled) {
      background: #475569;
      transform: translateY(-1px);
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 地址栏 */
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 0 14px;
      height: 42px;
      -webkit-app-region: no-drag;
      transition: all 0.2s;
    }

    .address-bar:focus-within {
      border-color: #22D3EE;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
    }

    .shield-icon {
      color: #22D3EE;
      font-size: 16px;
    }

    .address-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #F8FAFC;
      font-size: 14px;
      font-family: inherit;
    }

    .address-input::placeholder {
      color: #64748B;
    }

    /* 标签和书签按钮 */
    .tabs-btn, .bookmarks-btn {
      min-width: 60px;
      height: 32px;
      padding: 0 12px;
      border: none;
      border-radius: 8px;
      background: rgba(51, 65, 85, 0.5);
      color: #F8FAFC;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tabs-btn:hover, .bookmarks-btn:hover {
      background: #475569;
      transform: translateY(-1px);
    }

    .tab-count {
      background: #22D3EE;
      color: #0F172A;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
    }

    /* 清除按钮 */
    .wipe-btn {
      background: #DC2626;
      color: white;
      padding: 0 16px;
      height: 32px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wipe-btn:hover {
      background: #B91C1C;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }

    /* 内容区域 */
    .content-area {
      flex: 1;
      position: relative;
      background: #0B0E14;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    webview.active {
      display: block;
    }

    /* 状态栏 */
    .status-bar {
      height: 26px;
      background: #1E293B;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      color: #94A3B8;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22D3EE;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 标签面板 */
    .tabs-panel {
      position: absolute;
      top: 60px;
      right: 16px;
      width: 320px;
      max-height: 400px;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      overflow: hidden;
    }

    .tabs-panel.show {
      display: block;
      animation: slideDown 0.2s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tabs-header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs-title {
      font-size: 14px;
      font-weight: 600;
      color: #F8FAFC;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: #22D3EE;
      color: #0F172A;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .new-tab-btn:hover {
      background: #38BDF8;
      transform: scale(1.1);
    }

    .tabs-list {
      max-height: 340px;
      overflow-y: auto;
    }

    .tab-item {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tab-item:hover {
      background: rgba(51, 65, 85, 0.5);
    }

    .tab-item.active {
      background: rgba(34, 211, 238, 0.1);
      border-left: 3px solid #22D3EE;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-info {
      flex: 1;
      min-width: 0;
    }

    .tab-title {
      font-size: 13px;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .tab-url {
      font-size: 11px;
      color: #64748B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .tab-close {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #94A3B8;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .tab-close:hover {
      background: #DC2626;
      color: white;
    }

    /* 书签面板 */
    .bookmarks-panel {
      position: absolute;
      top: 60px;
      right: 16px;
      width: 280px;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      overflow: hidden;
    }

    .bookmarks-panel.show {
      display: block;
      animation: slideDown 0.2s ease;
    }

    .bookmarks-header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }

    .bookmarks-title {
      font-size: 14px;
      font-weight: 600;
      color: #F8FAFC;
    }

    .bookmarks-list {
      padding: 8px 0;
    }

    .bookmark-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bookmark-item:hover {
      background: rgba(51, 65, 85, 0.5);
    }

    .bookmark-icon {
      font-size: 20px;
    }

    .bookmark-info {
      flex: 1;
    }

    .bookmark-title {
      font-size: 13px;
      color: #F8FAFC;
      font-weight: 500;
    }

    .bookmark-url {
      font-size: 11px;
      color: #64748B;
      margin-top: 2px;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1E293B;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748B;
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="loading-bar" id="loadingBar" style="width: 0%"></div>

    <button class="nav-btn" id="backBtn" title="后退" disabled>←</button>
    <button class="nav-btn" id="forwardBtn" title="前进" disabled>→</button>
    <button class="nav-btn" id="reloadBtn" title="刷新">↻</button>

    <div class="address-bar">
      <span class="shield-icon">🛡️</span>
      <input
        type="text"
        class="address-input"
        id="addressInput"
        placeholder="输入网址或搜索 DuckDuckGo..."
        autocomplete="off"
      />
    </div>

    <button class="bookmarks-btn" id="bookmarksBtn" title="书签">
      ⭐ 书签
    </button>

    <button class="tabs-btn" id="tabsBtn" title="标签">
      <span>标签</span>
      <span class="tab-count" id="tabCount">1</span>
    </button>

    <button class="wipe-btn" id="wipeBtn" title="手动清除">
      🗑️ 清除
    </button>
  </div>

  <!-- 内容区域 -->
  <div class="content-area" id="contentArea"></div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="status-dot"></span>
    <span id="statusText">隐私模式 - 所有浏览数据将在关闭时自动清除</span>
  </div>

  <!-- 标签面板 -->
  <div class="tabs-panel" id="tabsPanel">
    <div class="tabs-header">
      <span class="tabs-title">标签页</span>
      <button class="new-tab-btn" id="newTabBtn" title="新建标签">+</button>
    </div>
    <div class="tabs-list" id="tabsList"></div>
  </div>

  <!-- 书签面板 -->
  <div class="bookmarks-panel" id="bookmarksPanel">
    <div class="bookmarks-header">
      <span class="bookmarks-title">书签</span>
    </div>
    <div class="bookmarks-list" id="bookmarksList">
      <div class="bookmark-item" data-url="https://jiurelay.com/">
        <span class="bookmark-icon">🔗</span>
        <div class="bookmark-info">
          <div class="bookmark-title">Jiurelay</div>
          <div class="bookmark-url">jiurelay.com</div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
