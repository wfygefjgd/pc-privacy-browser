<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐私浏览器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0B0E14;
      color: #F8FAFC;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1E293B;
      border-bottom: 1px solid #334155;
      -webkit-app-region: drag;
    }

    .nav-btn, .action-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #334155;
      color: #F8FAFC;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
      font-size: 16px;
    }

    .nav-btn:hover, .action-btn:hover {
      background: #475569;
    }

    .nav-btn:active, .action-btn:active {
      background: #1E293B;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 12px;
      height: 40px;
      -webkit-app-region: no-drag;
    }

    .address-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #F8FAFC;
      font-size: 14px;
      font-family: inherit;
    }

    .address-input::placeholder {
      color: #64748B;
    }

    .loading-bar {
      height: 2px;
      background: #22D3EE;
      transition: width 0.3s;
      position: absolute;
      top: 0;
      left: 0;
    }

    .wipe-btn {
      background: #DC2626;
      color: white;
      padding: 0 16px;
      height: 32px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
    }

    .wipe-btn:hover {
      background: #B91C1C;
    }

    .content-area {
      flex: 1;
      position: relative;
      background: #0B0E14;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status-bar {
      height: 24px;
      background: #1E293B;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      color: #94A3B8;
    }

    .shield-icon {
      color: #22D3EE;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="loading-bar" id="loadingBar" style="width: 0%"></div>

    <button class="nav-btn" id="backBtn" title="后退" disabled>←</button>
    <button class="nav-btn" id="forwardBtn" title="前进" disabled>→</button>
    <button class="nav-btn" id="reloadBtn" title="刷新">↻</button>

    <div class="address-bar">
      <span class="shield-icon">🛡️</span>
      <input
        type="text"
        class="address-input"
        id="addressInput"
        placeholder="输入网址或搜索..."
        autocomplete="off"
      />
    </div>

    <button class="wipe-btn" id="wipeBtn" title="手动清除">🗑️ 清除</button>
  </div>

  <div class="content-area">
    <webview
      id="browserView"
      src="about:blank"
      partition="privacy"
      allowpopups
      webpreferences="contextIsolation=yes,nodeIntegration=no"
    ></webview>
  </div>

  <div class="status-bar">
    <span class="shield-icon">🔒</span>
    <span id="statusText">隐私模式 - 所有浏览数据将在关闭时自动清除</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
